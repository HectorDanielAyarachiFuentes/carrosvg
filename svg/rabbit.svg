<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Ears -->
  <ellipse cx="60" cy="30" rx="5" ry="20" fill="#bdc3c7" transform="rotate(20 60 30)"/>
  <ellipse cx="60" cy="30" rx="2" ry="12" fill="#f1948a" transform="rotate(20 60 30)"/>
  
  <ellipse cx="45" cy="25" rx="5" ry="20" fill="#ecf0f1" transform="rotate(-10 45 25)"/>
  <ellipse cx="45" cy="25" rx="2" ry="12" fill="#fadbd8" transform="rotate(-10 45 25)"/>

  <!-- Body -->
  <ellipse cx="60" cy="65" rx="25" ry="20" fill="#ecf0f1"/>
  <ellipse cx="65" cy="60" rx="20" ry="15" fill="#ffffff"/>

  <!-- Tail -->
  <circle cx="85" cy="65" r="8" fill="#ffffff"/>
  
  <!-- Legs -->
  <ellipse cx="45" cy="80" rx="6" ry="10" fill="#bdc3c7" transform="rotate(-20 45 80)"/>
  <ellipse cx="70" cy="80" rx="12" ry="6" fill="#bdc3c7"/>
  <ellipse cx="65" cy="82" rx="12" ry="6" fill="#ecf0f1"/>

  <!-- Head -->
  <circle cx="40" cy="50" r="16" fill="#ecf0f1"/>
  <circle cx="38" cy="48" r="12" fill="#ffffff"/>

  <!-- Nose -->
  <circle cx="25" cy="52" r="2.5" fill="#f1948a"/>
  
  <!-- Eyes -->
  <circle cx="35" cy="46" r="2.5" fill="#2c3e50"/>
  <!-- Highlight -->
  <circle cx="34" cy="45" r="0.8" fill="#ffffff"/>
  
  <!-- Whisker -->
  <path stroke="#bdc3c7" stroke-width="1" fill="none" d="M15,50 L22,51 M16,54 L22,53"/>
</svg>