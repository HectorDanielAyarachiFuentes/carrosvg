<svg xmlns="http://www.w3.org/2000/svg" width="85" height="60" viewBox="0 0 85 60">
  <!-- Trailer connection part -->
  <rect x="2" y="40" width="8" height="6" fill="#34495e"/>

  <!-- Exhaust -->
  <rect x="10" y="24" width="4" height="24" fill="#bdc3c7"/>
  <rect x="9" y="22" width="6" height="4" fill="#95a5a6"/>

  <!-- Chassis bottom -->
  <rect x="8" y="47" width="75" height="7" rx="2" fill="#2c3e50"/>

  <!-- Main Cab Body -->
  <path fill="#e74c3c" d="M15,47 L15,15 C15,12 18,10 21,10 L42,10 L63,33 L80,33 C82,33 84,35 84,38 L84,47 Z"/>
  
  <!-- Cab highlight bottom -->
  <path fill="#c0392b" d="M15,40 L84,40 L84,47 L15,47 Z"/>

  <!-- Window -->
  <path fill="#34495e" d="M17,13 L40,13 L56,31 L17,31 Z"/>
  <path fill="#3498db" d="M19,15 L39,15 L53,30 L19,30 Z"/>

  <!-- Window divider (door) -->
  <rect x="33" y="13" width="2" height="18" fill="#2c3e50"/>

  <!-- Window glass reflection -->
  <path fill="#5dade2" d="M22,17 L30,17 L26,27 L18,27 Z"/>
  <path fill="#5dade2" d="M40,17 L45,17 L40,25 L35,25 Z"/>

  <!-- Door outline -->
  <path fill="none" stroke="#c0392b" stroke-width="1" d="M17,31 L17,45 L35,45 L35,31" />

  <!-- Door Handle -->
  <rect x="28" y="34" width="5" height="2" rx="1" fill="#ecf0f1"/>

  <!-- Side Mirror -->
  <rect x="42" y="25" width="4" height="8" rx="1" fill="#2c3e50"/>

  <!-- Front Grill Area -->
  <path fill="#ecf0f1" d="M74,34 L84,34 L84,47 L74,47 Z"/>
  <rect x="76" y="38" width="8" height="2" fill="#bdc3c7"/>
  <rect x="76" y="42" width="8" height="2" fill="#bdc3c7"/>

  <!-- Headlight -->
  <circle cx="82" cy="36" r="2.5" fill="#f1c40f"/>
  <circle cx="82.5" cy="35.5" r="1" fill="#fff"/>

  <!-- Wheel Arches -->
  <!-- Left Wheel Arch -->
  <path fill="#1a252f" d="M8.3,47 C8.3,37 26.3,37 26.3,47 Z"/>
  <!-- Right Wheel Arch -->
  <path fill="#1a252f" d="M62.5,47 C62.5,37 80.5,37 80.5,47 Z"/>
</svg>
