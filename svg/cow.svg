<svg xmlns="http://www.w3.org/2000/svg" width="60" height="40" viewBox="0 0 60 40">
  <!-- Legs -->
  <rect x="18" y="28" width="6" height="12" rx="2" fill="#dcdde1"/>
  <rect x="36" y="28" width="6" height="12" rx="2" fill="#dcdde1"/>
  <!-- Hooves -->
  <rect x="18" y="36" width="6" height="4" rx="1" fill="#2f3640"/>
  <rect x="36" y="36" width="6" height="4" rx="1" fill="#2f3640"/>
  
  <!-- Back legs slightly darker -->
  <rect x="24" y="28" width="6" height="12" rx="2" fill="#bdc3c7"/>
  <rect x="42" y="28" width="6" height="12" rx="2" fill="#bdc3c7"/>
  <rect x="24" y="36" width="6" height="4" rx="1" fill="#222f3e"/>
  <rect x="42" y="36" width="6" height="4" rx="1" fill="#222f3e"/>

  <!-- Body -->
  <rect x="15" y="10" width="35" height="20" rx="10" fill="#f5f6fa"/>
  
  <!-- Spots -->
  <path fill="#2f3640" d="M25,10 C30,12 35,10 32,18 C30,22 22,20 22,15 C20,12 25,10 25,10 Z"/>
  <path fill="#2f3640" d="M45,15 C48,15 50,18 48,22 C45,28 40,25 38,20 C38,15 42,12 45,15 Z"/>
  <path fill="#2f3640" d="M15,18 C18,18 20,22 18,28 C16,30 15,25 15,18 Z"/>
  
  <!-- Tail -->
  <path fill="none" stroke="#f5f6fa" stroke-width="2" d="M50,15 C55,18 55,25 58,25"/>
  <circle cx="58" cy="25" r="2" fill="#2f3640"/>

  <!-- Neck/Head base -->
  <circle cx="12" cy="15" r="8" fill="#f5f6fa"/>
  <!-- Snout -->
  <ellipse cx="6" cy="18" rx="5" ry="4" fill="#ffb8b8"/>
  <circle cx="4" cy="17" r="1" fill="#e17055"/>
  <circle cx="8" cy="17" r="1" fill="#e17055"/>
  
  <!-- Ear & Horn -->
  <ellipse cx="16" cy="10" rx="3" ry="1.5" fill="#f5f6fa" transform="rotate(-30 16 10)"/>
  <path fill="#f3a683" d="M12,8 Q15,4 16,3 Q14,6 12,8 Z"/>
  
  <!-- Eye -->
  <circle cx="9" cy="12" r="1.5" fill="#2f3640"/>
  <circle cx="8.5" cy="11.5" r="0.5" fill="#ffffff"/>
  
  <!-- Cowbell -->
  <rect x="15" y="20" width="4" height="6" rx="1" fill="#f1c40f"/>
  <rect x="16" y="20" width="2" height="1" fill="#f39c12"/>
</svg>
