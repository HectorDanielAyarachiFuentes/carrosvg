<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Tail -->
  <path fill="#d35400" d="M85,60 C95,50 95,30 80,40 C70,45 60,65 70,75 C75,80 85,75 85,60 Z"/>
  <!-- Tail Tip -->
  <path fill="#ecf0f1" d="M85,60 C90,55 95,45 90,40 C85,35 80,45 75,50 Z"/>
  
  <!-- Back Legs -->
  <rect x="55" y="65" width="8" height="25" rx="3" fill="#e67e22"/>
  <rect x="55" y="80" width="8" height="10" rx="3" fill="#2c3e50"/>
  <rect x="70" y="60" width="8" height="25" rx="3" fill="#d35400"/>
  <rect x="70" y="75" width="8" height="10" rx="3" fill="#1a252f"/>

  <!-- Body -->
  <path fill="#e67e22" d="M40,50 L70,50 C75,50 80,55 80,65 C80,70 70,75 60,70 L35,65 C30,60 30,50 40,50 Z"/>
  
  <!-- Belly -->
  <path fill="#ecf0f1" d="M45,65 C55,70 70,70 75,65 C60,65 50,60 45,65 Z"/>

  <!-- Front Legs -->
  <rect x="35" y="65" width="8" height="25" rx="3" fill="#e67e22"/>
  <rect x="35" y="80" width="8" height="10" rx="3" fill="#2c3e50"/>
  <rect x="45" y="60" width="8" height="25" rx="3" fill="#d35400"/>
  <rect x="45" y="75" width="8" height="10" rx="3" fill="#1a252f"/>

  <!-- Head -->
  <circle cx="35" cy="40" r="16" fill="#e67e22"/>
  <!-- Cheeks/Snout (White part) -->
  <path fill="#ecf0f1" d="M20,45 C20,55 50,55 50,45 C45,40 25,40 20,45 Z"/>
  
  <!-- Nose -->
  <circle cx="20" cy="45" r="3" fill="#2c3e50"/>

  <!-- Eyes -->
  <circle cx="30" cy="38" r="2.5" fill="#2c3e50"/>
  <circle cx="40" cy="38" r="2.5" fill="#2c3e50"/>

  <!-- Ears -->
  <path fill="#d35400" d="M25,28 L30,15 L38,26 Z"/>
  <path fill="#2c3e50" d="M28,24 L30,18 L34,24 Z"/>
  <path fill="#d35400" d="M40,28 L45,15 L48,26 Z"/>
  <path fill="#2c3e50" d="M42,24 L45,18 L46,24 Z"/>
